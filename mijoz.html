<!DOCTYPE html>
<html lang="uz">
<head><link rel="apple-touch-icon" href="icon-192.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHEF HOTDOG - Buyurtma berish</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #fff3a8 30%, #aa771c 70%, #fcf6ba 100%);
            --gold-btn: linear-gradient(180deg, #f7e089 0%, #c8962c 100%);
            --gold-text: #f5d061;
            --card-bg: rgba(18, 18, 18, 0.95);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: #0a0a0d; color: #fff; padding: 12px; }
        
        .header { text-align: center; padding: 15px; border-bottom: 1px solid rgba(212, 175, 55, 0.3); margin-bottom: 15px; }
        .header h1 { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 22px; }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .card { background: var(--card-bg); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 12px; padding: 10px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; }
        .price { color: var(--gold-text); font-weight: bold; margin: 5px 0; }
        
        .qty-control { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 5px; }
        .qty-btn { background: #222; border: 1px solid #d4af37; color: #fff; width: 26px; height: 26px; border-radius: 6px; font-weight: bold; }

        .order-form { background: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid rgba(212, 175, 55, 0.3); }
        .order-form input, .order-form textarea { width: 100%; padding: 10px; margin: 6px 0 12px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; }
        
        #map { height: 200px; width: 100%; border-radius: 10px; margin-bottom: 12px; border: 1px solid #d4af37; }
        .btn-gps { background: #2563eb; color: #fff; border: none; padding: 8px; width: 100%; border-radius: 8px; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        .btn-submit { background: var(--gold-btn); border: none; padding: 14px; width: 100%; font-weight: bold; font-size: 16px; border-radius: 10px; cursor: pointer; color: #000; }
    </style>
</head>
<body>

    <div class="header">
        <h1>CHEF HOTDOG</h1>
        <p style="font-size:12px; color:#aaa;">Yetkazib berish xizmati (Dostavka)</p>
    </div>

    <h3 style="color:var(--gold-text); margin-bottom:10px;">🍽 Taomni tanlang:</h3>
    <div id="menu-grid" class="grid">Yuklanmoqda...</div>

    <div class="order-form">
        <h3 style="color:var(--gold-text); margin-bottom:10px;">🛵 Yetkazib berish ma'lumotlari:</h3>
        <label>Ismingiz:</label>
        <input type="text" id="cust-name" placeholder="Masalan: Ali">
        
        <label>Telefon raqamingiz:</label>
        <input type="tel" id="cust-phone" placeholder="+998 90 123 45 67">

        <label>Kartadan joylashuvni tanlang:</label>
        <button class="btn-gps" onclick="getCurrentLocation()">📍 Mening joylashuvimni aniqlash</button>
        <div id="map"></div>

        <label>Qo'shimcha manzil va mo'ljal:</label>
        <textarea id="cust-address" rows="2" placeholder="Uy/Xonadon raqami, mo'ljal..."></textarea>

        <div style="margin-bottom: 12px; font-size: 16px;">
            Jami: <b id="total-price-sum" style="color:var(--gold-text);">0</b> so'm
        </div>

        <button class="btn-submit" onclick="dostavkaBuyurtmaYuborish()">BUYURTMA BERISH</button>
    </div>

    <script>
        const SUPABASE_URL = "https://wrrsvrgdinfmnuwewtoa.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndycnN2cmdkaW5mbW51d2V3dG9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzM0ODIsImV4cCI6MjEwMjU0OTQ4Mn0.YRHratsKVG42IY6YKokDycRy23oU8N3b7jO-o3tpQF4";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let cart = {};
        let menuItems = [];
        let selectedLat = 40.1006;
        let selectedLng = 65.3725;
        let map, marker;

        function initMap() {
            map = L.map('map').setView([selectedLat, selectedLng], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            marker = L.marker([selectedLat, selectedLng], {draggable: true}).addTo(map);

            marker.on('dragend', function(e) {
                const position = marker.getLatLng();
                selectedLat = position.lat;
                selectedLng = position.lng;
            });

            map.on('click', function(e) {
                selectedLat = e.latlng.lat;
                selectedLng = e.latlng.lng;
                marker.setLatLng(e.latlng);
            });
        }

        function getCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    selectedLat = position.coords.latitude;
                    selectedLng = position.coords.longitude;
                    map.setView([selectedLat, selectedLng], 16);
                    marker.setLatLng([selectedLat, selectedLng]);
                }, function() {
                    alert("GPS joylashuvingizni aniqlab bo'lmadi. Iltimos kartadan tanlang.");
                });
            }
        }

        async function menyuniYuklash() {
            const { data } = await db.from('menu').select('*');
            menuItems = data || [];
            let html = '';
            
            menuItems.forEach(m => {
                cart[m.id] = 0;
                html += `
                <div class="card">
                    <img src="${m.image_url || 'https://via.placeholder.com/150'}">
                    <b>${m.title}</b>
                    <div class="price">${m.price.toLocaleString()} so'm</div>
                    <div class="qty-control">
                        <button class="qty-btn" onclick="changeQty(${m.id}, -1)">-</button>
                        <span id="qty-${m.id}">0</span>
                        <button class="qty-btn" onclick="changeQty(${m.id}, 1)">+</button>
                    </div>
                </div>`;
            });
            document.getElementById('menu-grid').innerHTML = html;
        }

        function changeQty(id, delta) {
            if(cart[id] + delta >= 0) {
                cart[id] += delta;
                document.getElementById(`qty-${id}`).innerText = cart[id];
                hisoblaSumma();
            }
        }

        function hisoblaSumma() {
            let total = 0;
            menuItems.forEach(m => {
                total += (cart[m.id] || 0) * m.price;
            });
            document.getElementById('total-price-sum').innerText = total.toLocaleString();
        }

        async function dostavkaBuyurtmaYuborish() {
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;

            if(!name || !phone) return alert("Iltimos, ismingiz va telefon raqamingizni kiriting!");

            let itemsText = [];
            let totalAmount = 0;
            let totalCost = 0;

            menuItems.forEach(m => {
                const qty = cart[m.id] || 0;
                if(qty > 0) {
                    itemsText.push(`${m.title} (x${qty})`);
                    totalAmount += m.price * qty;
                    totalCost += (m.cost || 0) * qty;
                }
            });

            if(itemsText.length === 0) return alert("Iltimos, kamida bitta taom tanlang!");

            const mapLink = `https://www.google.com/maps?q=${selectedLat},${selectedLng}`;
            const fullStatusText = `🛵 DOSTAVKA: ${itemsText.join(', ')} | Mijoz: ${name} (${phone}) | Manzil: ${address || 'Kartada ko\'rsatilgan'} | MAP_LINK:${mapLink}`;

            const { error } = await db.from('sales').insert([{
                total_amount: totalAmount,
                total_cost: totalCost,
                profit: (totalAmount - totalCost),
                status: fullStatusText
            }]);

            if(error) alert("Xatolik: " + error.message);
            else {
                alert("✅ Buyurtmangiz qabul qilindi! Tez orada siz bilan bog'lanamiz.");
                location.reload();
            }
        }

        window.onload = function() {
            menyuniYuklash();
            initMap();
        };
    </script>
</body>
</html>
