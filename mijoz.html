<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHEF HOTDOG - Buyurtma berish</title>

    <!-- Sizning shaxsiy CHEF HOTDOG logotipingiz (iPhone va Android uchun) -->
    <link rel="apple-touch-icon" href="https://i.ibb.co/3ykX4S2/IMG-5133.jpg">
    <link rel="apple-touch-icon" sizes="180x180" href="https://i.ibb.co/3ykX4S2/IMG-5133.jpg">
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/3ykX4S2/IMG-5133.jpg">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-title" content="Chef Hotdog">

    <!-- SweetAlert2 va Leaflet Xarita kutubxonalari -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --gold-gradient: linear-gradient(135deg, #f5d061 0%, #e3a833 100%);
            --gold-btn: linear-gradient(180deg, #f7ce68 0%, #fbab7e 100%);
            --gold-text: #f5d061;
            --bg-card: rgba(18, 18, 20, 0.95);
            --border-color: rgba(245, 208, 97, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0d0f;
            color: #ffffff;
            padding-bottom: 110px;
        }

        header {
            padding: 20px 20px 10px 20px;
            text-align: center;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .sub-logo {
            font-size: 13px;
            color: #8e8e93;
            margin-top: 2px;
        }

        .container {
            padding: 10px 16px;
            max-width: 500px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--gold-text);
            margin: 15px 0 10px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Taomlar Setka Ko'rinishi */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .food-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .food-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 8px;
        }

        .food-title {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .food-price {
            font-size: 15px;
            font-weight: 800;
            color: var(--gold-text);
            margin-bottom: 8px;
        }

        /* Qushish / Kamaytirish Tugmalari */
        .counter-btn-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .qty-btn {
            background: #2c2c2e;
            color: #fff;
            border: 1px solid var(--border-color);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-count {
            font-size: 15px;
            font-weight: bold;
            min-width: 18px;
        }

        /* Formalar va Kiritish Maydonlari */
        .form-group {
            margin-top: 15px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px;
        }

        .form-label {
            font-size: 13px;
            color: #b0b0b5;
            margin-bottom: 5px;
            display: block;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            background: #18181a;
            color: #fff;
            border: 1px solid #3a3a3c;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            margin-bottom: 10px;
        }

        .input-field:focus {
            border-color: #f5d061;
        }

        .btn-location {
            width: 100%;
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        #map {
            height: 180px;
            width: 100%;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
        }

        /* Asosiy Buyurtma Tugmasi */
        .submit-btn {
            width: 100%;
            background: var(--gold-gradient);
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(227, 168, 51, 0.3);
            text-transform: uppercase;
        }

        .total-price-bar {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 800;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">CHEF HOTDOG</div>
        <div class="sub-logo" id="header-sub">Yetkazib berish xizmati (Dostavka)</div>
    </header>

    <div class="container">
        <div class="section-title">🍽 Taomni tanlang:</div>
        
        <div class="menu-grid" id="menu-container"></div>

        <div class="form-group">
            <div class="section-title" style="margin-top:0;">🛵 Yetkazib berish ma'lumotlari:</div>

            <label class="form-label">Xizmat turi:</label>
            <select id="order-type" class="input-field" onchange="toggleType()">
                <option value="delivery">Yetkazib berish (Dostavka)</option>
                <option value="table">Stolda tanavvul qilish</option>
            </select>

            <label class="form-label">Ismingiz:</label>
            <input type="text" id="cust-name" class="input-field" placeholder="Masalan: Ali">

            <label class="form-label">Telefon raqamingiz:</label>
            <input type="tel" id="cust-phone" class="input-field" placeholder="+998 90 123 45 67">

            <div id="delivery-box">
                <label class="form-label">Kartadan joylashuvni tanlang:</label>
                <button type="button" class="btn-location" onclick="getLocation()">📍 Mening joylashuvimni aniqlash</button>
                <div id="map"></div>

                <label class="form-label">Qo'shimcha manzil va mo'ljal:</label>
                <input type="text" id="cust-address" class="input-field" placeholder="Uy/Xonadon raqami, mo'ljal...">
            </div>

            <div class="total-price-bar">
                <span>Jami:</span>
                <span id="total-price" style="color: var(--gold-text);">0 so'm</span>
            </div>

            <button type="button" class="submit-btn" onclick="sendOrder()">BUYURTMA BERISH</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tableNum = urlParams.get('stol');

        if(tableNum) {
            document.getElementById('header-sub').innerText = `Stol: #${tableNum}`;
            document.getElementById('order-type').value = 'table';
        }

        // Taomlar ro'yxati va rasmlari
        const menuData = [
            { id: 1, name: "Tuxum & Sasiska", price: 15000, img: "https://images.unsplash.com/photo-1525351484163-7529414344d8?w=300" },
            { id: 2, name: "Chicken hotdog", price: 15000, img: "https://images.unsplash.com/photo-1619740455993-9e612b1af08a?w=300" },
            { id: 3, name: "Classic lavash", price: 28000, img: "https://images.unsplash.com/photo-1561651823-34feb02250e4?w=300" },
            { id: 4, name: "Chicken lavash", price: 22000, img: "https://images.unsplash.com/photo-1626700051175-6818013e1d4f?w=300" },
            { id: 5, name: "Sasiska lavash", price: 20000, img: "https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?w=300" },
            { id: 6, name: "DIL-DIL lagmon", price: 30000, img: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=300" }
        ];

        let cart = {};
        let map, marker, userLat = 41.311081, userLng = 69.240562;

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = menuData.map(item => {
                const qty = cart[item.id] || 0;
                return `
                    <div class="food-card">
                        <img src="${item.img}" class="food-img" alt="${item.name}">
                        <div class="food-title">${item.name}</div>
                        <div class="food-price">${item.price.toLocaleString()} so'm</div>
                        <div class="counter-btn-group">
                            <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                            <span class="qty-count">${qty}</span>
                            <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                        </div>
                    </div>
                `;
            }).join('');
            calculateTotal();
        }

        function updateQty(id, delta) {
            cart[id] = (cart[id] || 0) + delta;
            if (cart[id] <= 0) delete cart[id];
            renderMenu();
        }

        function calculateTotal() {
            let total = 0;
            for (let id in cart) {
                const item = menuData.find(m => m.id == id);
                total += item.price * cart[id];
            }
            document.getElementById('total-price').innerText = `${total.toLocaleString()} so'm`;
        }

        function toggleType() {
            const type = document.getElementById('order-type').value;
            const box = document.getElementById('delivery-box');
            if (type === 'delivery') {
                box.style.display = 'block';
            } else {
                box.style.display = 'none';
            }
        }

        function initMap() {
            map = L.map('map').setView([userLat, userLng], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            marker = L.marker([userLat, userLng], {draggable: true}).addTo(map);

            marker.on('dragend', function() {
                const pos = marker.getLatLng();
                userLat = pos.lat;
                userLng = pos.lng;
            });
        }

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    userLat = pos.coords.latitude;
                    userLng = pos.coords.longitude;
                    map.setView([userLat, userLng], 16);
                    marker.setLatLng([userLat, userLng]);
                }, () => {
                    alert("Joylashuvni aniqlashga ruxsat berilmadi.");
                });
            }
        }

        function sendOrder() {
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const type = document.getElementById('order-type').value;

            if (Object.keys(cart).length === 0) {
                Swal.fire({ icon: 'warning', title: 'Savat bo\'sh', text: 'Iltimos, taom tanlang!', background: '#1c1c1e', color: '#fff' });
                return;
            }

            if (!name || !phone) {
                Swal.fire({ icon: 'warning', title: 'Ma\'lumot yetarli emas', text: 'Ismingiz va telefon raqamingizni kiriting!', background: '#1c1c1e', color: '#fff' });
                return;
            }

            Swal.fire({
                icon: 'success',
                title: 'Buyurtma qabul qilindi!',
                text: 'Tez orada oshpazlarimiz tayyorlashni boshlaydi.',
                background: '#1c1c1e',
                color: '#fff',
                confirmButtonColor: '#f5d061'
            }).then(() => {
                cart = {};
                renderMenu();
            });
        }

        window.onload = function() {
            renderMenu();
            initMap();
            toggleType();
        };
    </script>
</body>
</html>
