<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHEF HOTDOG - Kassa va Savdo Tarixi</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --gold-gradient: linear-gradient(135deg, #f5d061 0%, #e3a833 100%);
            --gold-text: #f5d061;
            --bg-card: #18181a;
            --border-color: rgba(245, 208, 97, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0d0d0f;
            color: #ffffff;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 13px;
            color: #8e8e93;
            margin-bottom: 8px;
        }

        .stat-card .val {
            font-size: 22px;
            font-weight: 800;
            color: var(--gold-text);
        }

        .history-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
        }

        .history-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--gold-text);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .clear-btn {
            background: #ff3b30;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #2c2c2e;
            font-size: 14px;
        }

        th {
            color: #8e8e93;
            font-weight: 600;
        }

        .badge-success {
            background: rgba(52, 199, 89, 0.2);
            color: #34c759;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">CHEF HOTDOG — KASSA</div>
        <div id="clock" style="color: #8e8e93; font-weight: 600;"></div>
    </header>

    <!-- Umumiy Savdo Statistiakasi -->
    <div class="stats-grid">
        <div class="stat-card">
            <h3>JAMI SAVDO (BARCHA)</h3>
            <div class="val" id="total-all">0 so'm</div>
        </div>
        <div class="stat-card">
            <h3>JAMI BUYURTMALAR</h3>
            <div class="val" id="total-count">0 ta</div>
        </div>
    </div>

    <!-- Savdo Tarixi Jadvali -->
    <div class="history-section">
        <div class="history-title">
            <span>📜 Sotuvlar va Cheklar Tarixi</span>
            <button class="clear-btn" onclick="clearHistory()">Tarixni tozalash</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th># Chek ID</th>
                    <th>Vaqt</th>
                    <th>Buyurtma tarkibi</th>
                    <th>Summa</th>
                    <th>Holati</th>
                </tr>
            </thead>
            <tbody id="history-rows">
                <!-- Tarix shu yerga chiqadi -->
            </tbody>
        </table>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleString('uz-UZ');
        }
        setInterval(updateClock, 1000);

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('kassa_history')) || [];
            const tbody = document.getElementById('history-rows');
            
            let totalSum = 0;
            tbody.innerHTML = '';

            if (history.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#8e8e93; padding: 20px;">Hozircha hech qanday savdo tarixi mavjud emas.</td></tr>`;
            } else {
                history.forEach((item, index) => {
                    totalSum += item.amount;
                    tbody.innerHTML += `
                        <tr>
                            <td><b>#${item.id || (1000 + index)}</b></td>
                            <td>${item.time}</td>
                            <td>${item.items || 'Taomlar'}</td>
                            <td style="color: var(--gold-text); font-weight: bold;">${item.amount.toLocaleString()} so'm</td>
                            <td><span class="badge-success">To'langan</span></td>
                        </tr>
                    `;
                });
            }

            document.getElementById('total-all').innerText = `${totalSum.toLocaleString()} so'm`;
            document.getElementById('total-count').innerText = `${history.length} ta`;
        }

        function clearHistory() {
            Swal.fire({
                title: 'Tarixni o\'chirmoqchimisiz?',
                text: "Barcha saqlangan savdo tarixi o'chib ketadi!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ff3b30',
                cancelButtonColor: '#3a3a3c',
                confirmButtonText: 'Ha, o\'chirish',
                cancelButtonText: 'Bekor qilish'
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.removeItem('kassa_history');
                    loadHistory();
                    Swal.fire('O\'chirildi!', 'Kassa tarixi tozalandi.', 'success');
                }
            });
        }

        window.onload = function() {
            updateClock();
            loadHistory();
        };
    </script>
</body>
</html>
