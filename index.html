<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe POS & Boshqaruv</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 0; }
        body { background: #f0f2f5; padding: 15px; color: #333; }
        .nav { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .nav button { padding: 10px 14px; background: #007aff; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; white-space: nowrap; cursor: pointer; }
        .tab-content { display: none; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .active { display: block !important; }
        input, select, button.btn-save { width: 100%; padding: 12px; margin: 6px 0 12px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
        button.btn-save { background: #34c759; color: white; border: none; font-weight: bold; cursor: pointer; }
        .card { border: 1px solid #e5e5e5; padding: 12px; margin-bottom: 10px; border-radius: 8px; background: #fafafa; position: relative; overflow: hidden; }
        .menu-card { display: flex; gap: 12px; align-items: center; }
        .menu-img { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; background: #eee; flex-shrink: 0; }
        .tag-cost { color: #d97706; font-weight: bold; }
        .tag-price { color: #2563eb; font-weight: bold; }
        .status-pending { background: #fef08a; color: #854d0e; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .status-ready { background: #dcfce7; color: #166534; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .btn-ready { background: #34c759; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; width: 100%; }
        .btn-delete { background: #ff3b30; color: white; border: none; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .history-card { border-left: 4px solid #007aff; background: #f8fafc; padding: 10px; margin-bottom: 8px; border-radius: 4px; }
    </style>
</head>
<body>

    <h2 style="margin-bottom: 15px;">☕ Kafe Boshqaruvi</h2>

    <div class="nav">
        <button onclick="switchTab('pos')">📱 Ofitsiant</button>
        <button onclick="switchTab('kitchen')">👨‍🍳 Oshxona</button>
        <button onclick="switchTab('recipes')">📖 Menyu (Taomlar)</button>
        <button onclick="switchTab('stock')">📦 Ombor</button>
        <button onclick="switchTab('reports')">📊 Kassa va Tarix</button>
    </div>

    <!-- 1. OFITSIANT -->
    <div id="pos" class="tab-content active">
        <h3>Yangi Buyurtma</h3>
        <label>Taomni tanlang:</label>
        <select id="pos-select"></select>
        <button class="btn-save" onclick="buyurtmaBering()">👨‍🍳 Oshxonaga Yuborish</button>
    </div>

    <!-- 2. OSHXONA -->
    <div id="kitchen" class="tab-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h3>👨‍🍳 Oshxona Ekrani</h3>
            <button onclick="oshxonaniYuklash()" style="padding:5px 10px; background:#007aff; color:white; border:none; border-radius:6px;">🔄 Yangilash</button>
        </div>
        <div id="kitchen-orders-list">Yuklanmoqda...</div>
    </div>

    <!-- 3. MENYU (TAOMLAR VA RASM) -->
    <div id="recipes" class="tab-content">
        <h3>Yangi Taom Yaratish</h3>
        <input type="text" id="menu-title" placeholder="Taom nomi (masalan: Classic Hotdog)">
        <input type="number" id="menu-price" placeholder="Sotuv narxi (masalan: 12000 so'm)">
        <input type="number" id="menu-cost" placeholder="Tan narxi (masalan: 6000 so'm)">
        <input type="text" id="menu-image" placeholder="Rasm havolasi/URL (Internetdagi rasm ssilkasi)">
        <button class="btn-save" onclick="taomQoshish()">Taomni Saqlash</button>

        <h4 style="margin-top:15px;">Mavjud Taomlar:</h4>
        <div id="menu-with-cost-list"></div>
    </div>

    <!-- 4. OMBOR -->
    <div id="stock" class="tab-content">
        <h3>Ombor Masalliqlari</h3>
        <input type="text" id="ing-name" placeholder="Masalliq nomi">
        <input type="number" id="ing-qty" placeholder="Miqdori">
        <input type="text" id="ing-unit" placeholder="Birligi (dona, kg, litr)">
        <input type="number" id="ing-cost" placeholder="1 birlik narxi">
        <button class="btn-save" onclick="masalliqQoshish()">Masalliq Saqlash</button>
        
        <h4 style="margin-top:15px;">Mavjud Masalliqlar:</h4>
        <div id="stock-list"></div>
    </div>

    <!-- 5. KASSA VA SANA TARIXI -->
    <div id="reports" class="tab-content">
        <h3>📊 Bugungi Kassa (<span id="today-date-str"></span>)</h3>
        <div class="card">Bugungi Tushum: <b id="rep-rev" class="tag-price">0</b> so'm</div>
        <div class="card">Bugungi Tan Narx: <b id="rep-cost" class="tag-cost">0</b> so'm</div>
        <div class="card">Bugungi Saf Foyda: <b id="rep-profit" style="color:green; font-size:18px;">0</b> so'm</div>

        <hr style="margin: 20px 0;">

        <h3>📅 O'tgan Kunlar Tarixi</h3>
        <div id="daily-history-list" style="margin-top:10px;">Yuklanmoqda...</div>
    </div>

    <script>
        const SUPABASE_URL = "https://wrrsvrgdinfmnuwewtoa.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndycnN2cmdkaW5mbW51d2V3dG9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzM0ODIsImV4cCI6MjEwMjU0OTQ4Mn0.YRHratsKVG42IY6YKokDycRy23oU8N3b7jO-o3tpQF4";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'stock') omborniYuklash();
            if(id === 'pos' || id === 'recipes') tanlovlarniYuklash();
            if(id === 'kitchen') oshxonaniYuklash();
            if(id === 'reports') hisobotniYuklash();
        }

        function getTodayString() {
            return new Date().toISOString().split('T')[0];
        }

        // Ombor
        async function masalliqQoshish() {
            const name = document.getElementById('ing-name').value;
            const quantity = parseFloat(document.getElementById('ing-qty').value);
            const unit = document.getElementById('ing-unit').value;
            const cost_per_unit = parseFloat(document.getElementById('ing-cost').value);

            if(!name || isNaN(quantity) || !unit) return alert("Nom va miqdorni kiriting!");

            const { error } = await db.from('ingredients').insert([{ name, quantity, unit, cost_per_unit: cost_per_unit || 0 }]);
            if(error) alert("Xato: " + error.message);
            else { 
                alert("Masalliq qo'shildi!"); 
                document.getElementById('ing-name').value = '';
                document.getElementById('ing-qty').value = '';
                document.getElementById('ing-unit').value = '';
                document.getElementById('ing-cost').value = '';
                omborniYuklash(); 
            }
        }

        async function omborniYuklash() {
            const { data } = await db.from('ingredients').select('*');
            let html = '';
            (data || []).forEach(i => {
                html += `<div class="card"><b>${i.name}</b>: ${i.quantity} ${i.unit} (${i.cost_per_unit || 0} so'm)</div>`;
            });
            document.getElementById('stock-list').innerHTML = html || 'Ombor bo\'sh';
        }

        // Taom qo'shish (Rasm bilan)
        async function taomQoshish() {
            const title = document.getElementById('menu-title').value;
            const price = parseFloat(document.getElementById('menu-price').value);
            const cost = parseFloat(document.getElementById('menu-cost').value) || 0;
            const image_url = document.getElementById('menu-image').value;

            if(!title || isNaN(price)) return alert("Taom nomi va sotuv narxini kiriting!");

            const { error } = await db.from('menu').insert([{ title, price, cost, image_url }]);
            if(error) alert("Xato: " + error.message);
            else { 
                alert("Taom saqlandi!"); 
                document.getElementById('menu-title').value = '';
                document.getElementById('menu-price').value = '';
                document.getElementById('menu-cost').value = '';
                document.getElementById('menu-image').value = '';
                tanlovlarniYuklash(); 
            }
        }

        async function taomniOchirish(id, title) {
            if(confirm(`"${title}" taomini o'chirmoqchimisiz?`)) {
                await db.from('menu').delete().eq('id', id);
                tanlovlarniYuklash();
            }
        }

        async function tanlovlarniYuklash() {
            const { data: menu } = await db.from('menu').select('*');
            let mOpt = (menu || []).map(m => `<option value="${m.id}">${m.title} (${m.price} so'm)</option>`).join('');
            document.getElementById('pos-select').innerHTML = mOpt || '<option>Taomlar yo\'q</option>';

            let menuCards = '';
            (menu || []).forEach(m => {
                const costVal = m.cost || 0;
                const defaultImg = 'https://via.placeholder.com/70?text=No+Img';
                const imgSrc = m.image_url && m.image_url.startsWith('http') ? m.image_url : defaultImg;

                menuCards += `<div class="card">
                    <div class="menu-card">
                        <img src="${imgSrc}" class="menu-img" alt="${m.title}">
                        <div style="flex-grow:1;">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <b>${m.title}</b>
                                <button class="btn-delete" onclick="taomniOchirish(${m.id}, '${m.title}')">🗑 O'chirish</button>
                            </div>
                            <small>Sotuv: <span class="tag-price">${m.price.toLocaleString()} so'm</span></small><br>
                            <small>Tan narx: <span class="tag-cost">${costVal.toLocaleString()} so'm</span></small>
                        </div>
                    </div>
                </div>`;
            });
            document.getElementById('menu-with-cost-list').innerHTML = menuCards || 'Taomlar yo\'q';
        }

        // POS
        async function buyurtmaBering() {
            const menu_id = document.getElementById('pos-select').value;
            if(!menu_id) return alert("Taom tanlanmagan!");

            const { data: menuItem } = await db.from('menu').select('*').eq('id', menu_id).single();
            if(!menuItem) return alert("Taom topilmadi!");

            const price = menuItem.price || 0;
            const cost = menuItem.cost || 0;

            const { error } = await db.from('sales').insert([{ 
                total_amount: price, 
                total_cost: cost, 
                profit: (price - cost),
                status: 'kutilmoqda'
            }]);

            if(error) alert("Xato: " + error.message);
            else alert("Buyurtma oshxonaga yuborildi!");
        }

        // Oshxona
        async function oshxonaniYuklash() {
            const { data: sales } = await db.from('sales').select('*').order('created_at', { ascending: false });
            let html = '';

            (sales || []).slice(0, 30).forEach((s, idx) => {
                const isReady = s.status === 'tayyor';
                const timeStr = new Date(s.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                html += `<div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <b>#${sales.length - idx} Buyurtma (${timeStr})</b>
                        <span class="${isReady ? 'status-ready' : 'status-pending'}">
                            ${isReady ? '✅ TAYYOR' : '⏱ TAYYORLANMOQDA'}
                        </span>
                    </div>
                    <p style="margin-top:5px;">Summa: ${s.total_amount.toLocaleString()} so'm</p>
                    ${!isReady ? `<button class="btn-ready" onclick="buyurtmaniTayyorLash(${s.id})">✅ TAYYOR BO'LDI</button>` : ''}
                </div>`;
            });
            document.getElementById('kitchen-orders-list').innerHTML = html || 'Buyurtmalar yo\'q';
        }

        async function buyurtmaniTayyorLash(id) {
            const { error } = await db.from('sales').update({ status: 'tayyor' }).eq('id', id);
            if(error) alert("Xatolik: " + error.message);
            else oshxonaniYuklash();
        }

        // Kassa va Tarix
        async function hisobotniYuklash() {
            const todayStr = getTodayString();
            document.getElementById('today-date-str').innerText = todayStr;

            const { data: sales } = await db.from('sales').select('*').order('created_at', { ascending: false });

            let todayRev = 0, todayCost = 0, todayProfit = 0;
            let dailyGroups = {};

            (sales || []).forEach(s => {
                const dateStr = s.created_at.split('T')[0];

                if (!dailyGroups[dateStr]) {
                    dailyGroups[dateStr] = { rev: 0, cost: 0, profit: 0, count: 0 };
                }

                const rev = parseFloat(s.total_amount || 0);
                const cost = parseFloat(s.total_cost || 0);
                const profit = parseFloat(s.profit || 0);

                dailyGroups[dateStr].rev += rev;
                dailyGroups[dateStr].cost += cost;
                dailyGroups[dateStr].profit += profit;
                dailyGroups[dateStr].count += 1;

                if (dateStr === todayStr) {
                    todayRev += rev;
                    todayCost += cost;
                    todayProfit += profit;
                }
            });

            document.getElementById('rep-rev').innerText = todayRev.toLocaleString();
            document.getElementById('rep-cost').innerText = todayCost.toLocaleString();
            document.getElementById('rep-profit').innerText = todayProfit.toLocaleString();

            let historyHtml = '';
            Object.keys(dailyGroups).sort().reverse().forEach(date => {
                if (date !== todayStr) {
                    const item = dailyGroups[date];
                    historyHtml += `<div class="history-card">
                        <b>📅 ${date} Sanadagi Savdo:</b><br>
                        Jami savdo: <b>${item.rev.toLocaleString()}</b> so'm (${item.count} ta buyurtma)<br>
                        Saf Foyda: <b style="color:green;">+${item.profit.toLocaleString()} so'm</b>
                    </div>`;
                }
            });

            document.getElementById('daily-history-list').innerHTML = historyHtml || '<i>Hali o\'tgan kunlar tarixi yo\'q.</i>';
        }

        tanlovlarniYuklash();
        setInterval(() => {
            if(document.getElementById('kitchen').classList.contains('active')) oshxonaniYuklash();
        }, 10000);
    </script>
</body>
</html>
