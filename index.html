<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHEF HOTDOG</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #0d0d0f; color: #fff; font-family: sans-serif; padding: 10px; }
        .header-box { border: 1px solid rgba(245, 208, 97, 0.3); border-radius: 16px; padding: 15px; text-align: center; margin-bottom: 15px; }
        .logo-title { font-size: 22px; font-weight: 900; color: #f5d061; text-transform: uppercase; }
        
        /* Tepadagi Boshqaruv Tugmalari */
        .nav-buttons { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
        .nav-btn { background: #1c1c1e; color: #f5d061; border: 1px solid rgba(245, 208, 97, 0.4); padding: 10px 14px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 5px; }
        .nav-btn.stop-btn { color: #ff3b30; border-color: rgba(255, 59, 48, 0.4); }

        .food-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .food-card { background: #18181a; border: 1px solid rgba(245, 208, 97, 0.2); border-radius: 14px; padding: 10px; text-align: center; position: relative; }
        .food-card.stopped { opacity: 0.4; filter: grayscale(1); pointer-events: none; }
        .food-card.stopped::after { content: "STOP-LIST"; position: absolute; top: 40%; left: 10%; right: 10%; background: #ff3b30; color: #fff; font-weight: bold; padding: 5px; border-radius: 6px; font-size: 12px; }
        .food-img { width: 100%; height: 110px; object-fit: cover; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header-box">
        <div class="logo-title">CHEF HOTDOG</div>
    </div>

    <!-- Tepadagi Barcha Bo'lim Tugmalari (Stop-List Bilan) -->
    <div class="nav-buttons">
        <button class="nav-btn" onclick="showSection('menu')">📱 Ofitsiant (Menyu)</button>
        <button class="nav-btn" onclick="showSection('kitchen')">👨‍🍳 Oshxona</button>
        <button class="nav-btn stop-btn" onclick="openStopListModal()">🛑 Stop List</button>
    </div>

    <div id="food-container" class="food-grid"></div>

    <script>
        const menuData = [
            { id: 1, name: "TUXUM & SASISKA", price: 15000, img: "img/tuxum_sasiska.jpg" },
            { id: 2, name: "Chicken hotdog", price: 15000, img: "img/chicken_hotdog.jpg" },
            { id: 3, name: "Classic lavash", price: 28000, img: "img/classic_lavash.jpg" },
            { id: 4, name: "chicken lavash", price: 22000, img: "img/chicken_lavash.jpg" },
            { id: 5, name: "SASISKA lavash", price: 25000, img: "img/sasiska_lavash.jpg" },
            { id: 6, name: "DIL-DIL lagmon", price: 30000, img: "img/dildil_lagmon.jpg" }
        ];

        let stopList = JSON.parse(localStorage.getItem('stop_list')) || [];

        function renderMenu() {
            const container = document.getElementById('food-container');
            container.innerHTML = menuData.map(item => {
                const isStopped = stopList.includes(item.id);
                return `
                    <div class="food-card ${isStopped ? 'stopped' : ''}">
                        <img src="${item.img}" class="food-img" onerror="this.src='https://i.ibb.co/3ykX4S2/IMG-5133.jpg'">
                        <div style="font-weight:bold; margin:6px 0;">${item.name}</div>
                        <div style="color:#f5d061; font-weight:bold;">${item.price.toLocaleString()} so'm</div>
                    </div>
                `;
            }).join('');
        }

        // Stop List Boshqaruv Oynasi
        function openStopListModal() {
            let htmlContent = '<div style="text-align:left;">';
            menuData.forEach(item => {
                const checked = stopList.includes(item.id) ? 'checked' : '';
                htmlContent += `
                    <div style="margin-bottom:10px; font-size:16px;">
                        <label>
                            <input type="checkbox" onchange="toggleStop(${item.id})" ${checked}>
                            ${item.name}
                        </label>
                    </div>
                `;
            });
            htmlContent += '</div>';

            Swal.fire({
                title: '🛑 Stop-List Boshqaruvi',
                html: htmlContent,
                background: '#1c1c1e',
                color: '#fff',
                confirmButtonColor: '#f5d061',
                confirmButtonText: 'Yopish'
            });
        }

        function toggleStop(id) {
            if (stopList.includes(id)) {
                stopList = stopList.filter(item => item !== id);
            } else {
                stopList.push(id);
            }
            localStorage.setItem('stop_list', JSON.stringify(stopList));
            renderMenu();
        }

        window.onload = renderMenu;
    </script>
</body>
</html>
