<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHEF HOTDOG - Boshqaruv Paneli</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --gold: #d4af37;
            --green: #28a745;
            --red: #dc3545;
            --text: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
        }

        .header {
            text-align: center;
            padding: 10px;
            border-bottom: 2px solid var(--gold);
            margin-bottom: 20px;
        }

        .header h1 {
            color: var(--gold);
            margin: 0;
            font-size: 24px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .tab-btn {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--gold);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .tab-btn.active {
            background: var(--gold);
            color: #000;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Card Styles */
        .card {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        /* Tayyor bo'lgan buyurtmalar uchun yashil chiziq */
        .card.completed {
            border: 2px solid var(--green) !important;
            box-shadow: 0 0 12px rgba(40, 167, 69, 0.4);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .btn-ready {
            background: var(--green);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-cancel {
            background: var(--red);
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .kassa-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--gold);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            margin: 0 0 5px 0;
            color: var(--gold);
        }

        .stat-card p {
            margin: 0;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>CHEF HOTDOG</h1>
    </div>

    <!-- Navigatsiya tugmalari -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('kitchen')">👨‍🍳 Oshxona</button>
        <button class="tab-btn" onclick="switchTab('reports')">💰 Kassa va Tarix</button>
    </div>

    <!-- 1. OSHXONA BO'LIMI -->
    <div id="kitchen" class="tab-content active">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2>👨‍🍳 Oshxona Ekrani</h2>
            <button class="tab-btn" onclick="loadKitchenOrders()">🔄 Yangilash</button>
        </div>
        <div id="kitchen-orders-list">
            <!-- Buyurtmalar JavaScript orqali chiqadi -->
        </div>
    </div>

    <!-- 2. KASSA VA TARIX BO'LIMI -->
    <div id="reports" class="tab-content">
        <h2 style="color: var(--gold);">💰 Kassa va Savdo Tarixi</h2>
        
        <div class="kassa-stats">
            <div class="stat-card">
                <h3>Bugungi Savdo</h3>
                <p id="today-total-sales">0 so'm</p>
            </div>
            <div class="stat-card">
                <h3>Bugungi Buyurtmalar</h3>
                <p id="today-total-count">0 ta</p>
            </div>
        </div>

        <hr style="margin: 20px 0; border-color: #333;">

        <h3>Kunlik Buyurtmalar Ro'yxati</h3>
        <div id="daily-history-list">
            <!-- Kassa va kunlik tarix bu yerga chiqadi -->
        </div>
    </div>

    <script>
        // --- SUPABASE SOZLAMALARI ---
        const SUPABASE_URL = 'YOUR_SUPABASE_URL'; // O'zingizning Supabase URlingizni qo'ying
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY'; // O'zingizning Supabase Anon Key'ingizni qo'ying
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- RESTORAN KOORDINATASI (QARSHI) ---
        const RESTAURANT_LAT = 38.849464;
        const RESTAURANT_LNG = 65.793417;

        // --- TABLARNI ALMASHTIRISH ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');

            if(tabId === 'kitchen') loadKitchenOrders();
            if(tabId === 'reports') loadKassaReports();
        }

        // --- 1. OSHXONA BUYURTMALARINI YUKLASH ---
        async function loadKitchenOrders() {
            const container = document.getElementById('kitchen-orders-list');
            container.innerHTML = '<p>Yuklanmoqda...</p>';

            const { data: orders, error } = await db
                .from('orders')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                container.innerHTML = '<p>Xatolik yuz berdi!</p>';
                return;
            }

            container.innerHTML = '';

            orders.forEach(order => {
                // Toshkent vaqtiga to'g'rilash
                const orderTime = new Date(order.created_at).toLocaleTimeString('uz-UZ', {
                    timeZone: 'Asia/Tashkent',
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                });

                const isCompleted = order.status === 'completed';
                const cardClass = isCompleted ? 'card completed' : 'card';
                const statusTag = isCompleted ? '[TAYYOR BO\'LDI]' : '[KUTILMOQDA]';

                const cardHtml = `
                    <div class="${cardClass}">
                        <div class="card-header">
                            <span>#${order.id} (${orderTime})</span>
                            ${!isCompleted ? 
                                `<button class="btn-ready" onclick="markAsReady(${order.id}, ${order.total_amount})">✅ TAYYOR</button>` : 
                                `<span style="color: var(--green); font-size: 14px;">✅ TAYYOR</span>`
                            }
                        </div>
                        <div>
                            <strong>Stol #${order.table_number || 'Dostavka'} - ${order.items_description}</strong> ${statusTag}
                        </div>
                        <div style="margin-top: 8px;">
                            Summa: <strong>${order.total_amount.toLocaleString()} so'm</strong>
                        </div>
                        <button class="btn-cancel" onclick="cancelOrder(${order.id})">❌ Bekor qilish</button>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        // --- 2. TAYYOR TUGMASI BOSILGANDA (KASSA + STATUS YANGILASH) ---
        async function markAsReady(orderId, orderSumma) {
            // Statusni update qilish
            const { error: orderError } = await db
                .from('orders')
                .update({ status: 'completed' })
                .eq('id', orderId);

            if (orderError) {
                alert('Xatolik: Buyurtma statusi o\'zgarmadi!');
                return;
            }

            // Toshkent vaqti bo'yicha bugungi sanani olish (YYYY-MM-DD)
            const today = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Tashkent' });

            // Bugungi kassa hisobotini tekshirish
            const { data: dailyReports } = await db
                .from('reports')
                .select('*')
                .eq('date', today);

            if (dailyReports && dailyReports.length > 0) {
                // Mavjud kunlik summani va sonini oshirish
                await db.from('reports')
                    .update({ 
                        total_sales: dailyReports[0].total_sales + orderSumma,
                        total_orders: dailyReports[0].total_orders + 1
                    })
                    .eq('date', today);
            } else {
                // Yangi kun uchun kassa yozuvi ochish
                await db.from('reports')
                    .insert([{ 
                        date: today, 
                        total_sales: orderSumma,
                        total_orders: 1
                    }]);
            }

            // Oshxona ro'yxatini yangilash
            loadKitchenOrders();
        }

        // --- 3. BUYURTMANI BEKOR QILISH ---
        async function cancelOrder(orderId) {
            if (confirm('Rostdan ham ushbu buyurtmani bekor qilmoqchimisiz?')) {
                await db.from('orders').delete().eq('id', orderId);
                loadKitchenOrders();
            }
        }

        // --- 4. KASSA VA TARIXNI YUKLASH ---
        async function loadKassaReports() {
            const today = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Tashkent' });

            // Bugungi kassa ma'lumotlarini olish
            const { data: reports } = await db
                .from('reports')
                .select('*')
                .eq('date', today);

            if (reports && reports.length > 0) {
                document.getElementById('today-total-sales').innerText = reports[0].total_sales.toLocaleString() + " so'm";
                document.getElementById('today-total-count').innerText = reports[0].total_orders + " ta";
            } else {
                document.getElementById('today-total-sales').innerText = "0 so'm";
                document.getElementById('today-total-count').innerText = "0 ta";
            }

            // Yakunlangan tarix ro'yxatini ko'rsatish
            const historyContainer = document.getElementById('daily-history-list');
            const { data: completedOrders } = await db
                .from('orders')
                .select('*')
                .eq('status', 'completed')
                .order('id', { ascending: false });

            historyContainer.innerHTML = '';
            if (completedOrders) {
                completedOrders.forEach(ord => {
                    const time = new Date(ord.created_at).toLocaleTimeString('uz-UZ', {
                        timeZone: 'Asia/Tashkent',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                    historyContainer.innerHTML += `
                        <div class="card completed" style="padding: 10px;">
                            <strong>#${ord.id} (${time})</strong> - ${ord.items_description} | 
                            <span style="color: var(--gold);">${ord.total_amount.toLocaleString()} so'm</span>
                        </div>
                    `;
                });
            }
        }

        // Sahifa yuklanganda dastlabki ma'lumotlarni yuklash
        window.onload = () => {
            loadKitchenOrders();
        };
    </script>
</body>
</html>
